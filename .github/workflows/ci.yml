name: ci

on:
  push:
    branches: ["nimbus/v*"]
    tags: ["v*-nimbus.*"]
  pull_request:
    branches: ["nimbus/v*"]

permissions:
  contents: read

jobs:
  build:
    name: release ${{ matrix.config.target }}
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: macos-15
            target: aarch64-apple-darwin
            cargo: cargo

          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            cargo: cargo

          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            cargo: cargo

          - os: windows-2022
            target: x86_64-pc-windows-msvc
            cargo: cargo

      # x86_64-apple-darwin is intentionally omitted for now.
      # Nimbus does not currently ship Intel Mac support, and this target adds
      # substantial CI time. Re-enable when release-build budget or platform
      # support priorities change.

    env:
      V8_FROM_SOURCE: true
      CARGO_VARIANT_FLAG: "--release"
      LIB_NAME: ${{ contains(matrix.config.target, 'windows') && 'rusty_v8' || 'librusty_v8' }}
      LIB_EXT: ${{ contains(matrix.config.target, 'windows') && 'lib' || 'a' }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
      RUSTFLAGS: -D warnings

    steps:
      - name: Configure git
        run: git config --global core.symlinks true

      - name: Clone repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 10
          submodules: recursive

      - name: Configure googlesource credentials
        if: env.GOOGLESOURCE_COOKIE != ''
        env:
          GOOGLESOURCE_COOKIE: ${{ secrets.GOOGLESOURCE_COOKIE }}
        run: |
          touch ~/.gitcookies && chmod 0600 ~/.gitcookies
          git config --global http.cookiefile ~/.gitcookies
          echo ".googlesource.com	TRUE	/	TRUE	2147483647	o	${GOOGLESOURCE_COOKIE}" >> ~/.gitcookies
          git config --global url."https://chromium.googlesource.com/a/".insteadOf "https://chromium.googlesource.com/"

      - name: Install rust
        uses: dsherret/rust-toolchain-file@v1

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.19.1

      - name: Install nextest
        run: cargo binstall cargo-nextest --secure --locked --no-confirm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install python
        uses: actions/setup-python@v6
        with:
          python-version: 3.11.x
          architecture: x64

      - name: Clear Python package cache
        if: startsWith(matrix.config.os, 'macos')
        run: python -m pip cache purge || true

      - name: Install cross compilation toolchain
        if: matrix.config.target == 'aarch64-unknown-linux-gnu'
        run: |
          rustup target add aarch64-unknown-linux-gnu

          sudo apt update
          sudo apt install -yq --no-install-suggests --no-install-recommends \
            binfmt-support g++-10-aarch64-linux-gnu g++-10-multilib \
            gcc-10-aarch64-linux-gnu libc6-arm64-cross qemu qemu-user \
            qemu-user-binfmt

          sudo ln -s /usr/aarch64-linux-gnu/lib/ld-linux-aarch64.so.1 \
                     /lib/ld-linux-aarch64.so.1

          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=/usr/bin/aarch64-linux-gnu-gcc-10" >> ${GITHUB_ENV}
          echo "QEMU_LD_PREFIX=/usr/aarch64-linux-gnu" >> ${GITHUB_ENV}

      - name: Write git_submodule_status.txt
        run: git submodule status --recursive > git_submodule_status.txt

      - name: Cache
        if: matrix.config.target != 'aarch64-apple-darwin'
        uses: actions/cache@v5
        with:
          path: |-
            target/sccache
            target/*/.*
            target/*/build
            target/*/deps
          key: cargo1-${{ matrix.config.target }}-release-${{ hashFiles('Cargo.lock', 'build.rs', 'git_submodule_status.txt') }}
          restore-keys: cargo1-${{ matrix.config.target }}-release-

      - name: Install and start sccache
        shell: pwsh
        env:
          SCCACHE_DIR: ${{ github.workspace }}/target/sccache
          SCCACHE_CACHE_SIZE: 256M
          SCCACHE_IDLE_TIMEOUT: 0
        run: |
          $version = "v0.8.2"
          $platform =
            @{ "x86_64-apple-darwin"       = "x86_64-apple-darwin"
               "aarch64-apple-darwin"      = "aarch64-apple-darwin"
               "x86_64-unknown-linux-gnu"  = "x86_64-unknown-linux-musl"
               "aarch64-unknown-linux-gnu" = "aarch64-unknown-linux-musl"
               "x86_64-pc-windows-msvc"    = "x86_64-pc-windows-msvc"
             }['${{ matrix.config.target }}']
          $basename = "sccache-$version-$platform"
          $url = "https://github.com/mozilla/sccache/releases/download/$version/$basename.tar.gz"
          cd ~
          curl -LO $url
          tar -xzvf "$basename.tar.gz"
          . $basename/sccache --start-server
          echo "$(pwd)/$basename" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Clang
        if: startsWith(matrix.config.os, 'ubuntu')
        run: |
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-19 main" | sudo dd of=/etc/apt/sources.list.d/llvm-toolchain-jammy-19.list
          curl https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo dd of=/etc/apt/trusted.gpg.d/llvm-snapshot.gpg
          sudo apt-get update
          sudo apt-get -qq remove 'clang-*'
          sudo apt-get install lld-19 clang-19 clang-tools-19 clang-tidy-19 clang-format-19 libclang-19-dev -y
          echo "LIBCLANG_PATH=/usr/lib/llvm-19/lib" >> $GITHUB_ENV

      - name: Set LIBCLANG_PATH (macOS)
        if: startsWith(matrix.config.os, 'macos')
        run: |
          XCODE_CLANG_LIB="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          echo "LIBCLANG_PATH=$XCODE_CLANG_LIB" >> $GITHUB_ENV

      - name: Check Rust formatting
        if: matrix.config.target == 'x86_64-unknown-linux-gnu'
        run: cargo fmt --check

      - name: Check C++ formatting
        if: matrix.config.target == 'x86_64-unknown-linux-gnu'
        run: clang-format-19 --verbose --Werror --dry-run src/*.cc src/*.hpp src/*.h

      - name: Test
        env:
          SCCACHE_IDLE_TIMEOUT: 0
        run: ${{ matrix.config.cargo }} nextest run -v --cargo-verbose --cargo-verbose --all-targets --locked --target ${{ matrix.config.target }} ${{ env.CARGO_VARIANT_FLAG }}

      - name: Clippy
        run: ${{ matrix.config.cargo }} clippy --all-targets --locked --target ${{ matrix.config.target }} ${{ env.CARGO_VARIANT_FLAG }} -- -D clippy::all

      - name: Prepare default binary publish
        run: |
          gzip -9c target/${{ matrix.config.target }}/release/gn_out/obj/${{ env.LIB_NAME }}.${{ env.LIB_EXT }} > target/${{ env.LIB_NAME }}_release_${{ matrix.config.target }}.${{ env.LIB_EXT }}.gz
          ls -l target/${{ env.LIB_NAME }}_release_${{ matrix.config.target }}.${{ env.LIB_EXT }}.gz

          cp target/${{ matrix.config.target }}/release/gn_out/src_binding.rs target/src_binding_release_${{ matrix.config.target }}.rs
          ls -l target/src_binding_release_${{ matrix.config.target }}.rs

      - name: Test simdutf
        env:
          SCCACHE_IDLE_TIMEOUT: 0
        run: ${{ matrix.config.cargo }} nextest run -v --cargo-verbose --cargo-verbose --all-targets --locked --target ${{ matrix.config.target }} ${{ env.CARGO_VARIANT_FLAG }} --features simdutf

      - name: Clippy simdutf
        run: ${{ matrix.config.cargo }} clippy --all-targets --locked --target ${{ matrix.config.target }} ${{ env.CARGO_VARIANT_FLAG }} --features simdutf -- -D clippy::all

      - name: Build simdutf release artifacts
        run: ${{ matrix.config.cargo }} build --locked --target ${{ matrix.config.target }} ${{ env.CARGO_VARIANT_FLAG }} --features simdutf

      - name: Prepare simdutf binary publish
        run: |
          gzip -9c target/${{ matrix.config.target }}/release/gn_out/obj/${{ env.LIB_NAME }}.${{ env.LIB_EXT }} > target/${{ env.LIB_NAME }}_simdutf_release_${{ matrix.config.target }}.${{ env.LIB_EXT }}.gz
          ls -l target/${{ env.LIB_NAME }}_simdutf_release_${{ matrix.config.target }}.${{ env.LIB_EXT }}.gz

          cp target/${{ matrix.config.target }}/release/gn_out/src_binding.rs target/src_binding_simdutf_release_${{ matrix.config.target }}.rs
          ls -l target/src_binding_simdutf_release_${{ matrix.config.target }}.rs

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rusty-v8-release-${{ matrix.config.target }}
          path: |
            target/${{ env.LIB_NAME }}_release_${{ matrix.config.target }}.${{ env.LIB_EXT }}.gz
            target/src_binding_release_${{ matrix.config.target }}.rs
            target/${{ env.LIB_NAME }}_simdutf_release_${{ matrix.config.target }}.${{ env.LIB_EXT }}.gz
            target/src_binding_simdutf_release_${{ matrix.config.target }}.rs
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: publish release assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: rusty-v8-release-*
          merge-multiple: true

      - name: Verify release asset set
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "librusty_v8_release_aarch64-apple-darwin.a.gz"
            "librusty_v8_simdutf_release_aarch64-apple-darwin.a.gz"
            "src_binding_release_aarch64-apple-darwin.rs"
            "src_binding_simdutf_release_aarch64-apple-darwin.rs"
            "librusty_v8_release_x86_64-unknown-linux-gnu.a.gz"
            "librusty_v8_simdutf_release_x86_64-unknown-linux-gnu.a.gz"
            "src_binding_release_x86_64-unknown-linux-gnu.rs"
            "src_binding_simdutf_release_x86_64-unknown-linux-gnu.rs"
            "librusty_v8_release_aarch64-unknown-linux-gnu.a.gz"
            "librusty_v8_simdutf_release_aarch64-unknown-linux-gnu.a.gz"
            "src_binding_release_aarch64-unknown-linux-gnu.rs"
            "src_binding_simdutf_release_aarch64-unknown-linux-gnu.rs"
            "rusty_v8_release_x86_64-pc-windows-msvc.lib.gz"
            "rusty_v8_simdutf_release_x86_64-pc-windows-msvc.lib.gz"
            "src_binding_release_x86_64-pc-windows-msvc.rs"
            "src_binding_simdutf_release_x86_64-pc-windows-msvc.rs"
          )
          missing=0
          for file in "${expected[@]}"; do
            if [[ ! -s "release-artifacts/$file" ]]; then
              echo "::error::missing release artifact $file"
              missing=1
            fi
          done
          if [[ "$missing" != 0 ]]; then
            exit 1
          fi
          find release-artifacts -maxdepth 1 -type f -print | sort

      - name: Binary publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes "Nimbus rusty_v8 $GITHUB_REF_NAME" \
              --draft \
              --verify-tag \
              || gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            release-artifacts/*
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
