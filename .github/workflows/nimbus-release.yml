name: nimbus release assets

on:
  push:
    branches: ["nimbus/v*"]
    tags: ["v*-nimbus.*"]
  pull_request:
    branches: ["nimbus/v*"]

permissions:
  contents: read

jobs:
  build:
    name: release ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            pointer_compression: true
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            pointer_compression: true
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            pointer_compression: true
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            pointer_compression: false
    env:
      V8_FROM_SOURCE: "true"
      RUSTFLAGS: -D warnings
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_CACHE_SIZE: 2G
      SCCACHE_IDLE_TIMEOUT: 0
    steps:
      - name: Configure git
        run: git config --global core.symlinks true

      - name: Clone repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 10
          submodules: recursive

      - name: Install Rust
        uses: dsherret/rust-toolchain-file@v1

      - name: Install nextest
        uses: taiki-e/install-action@c93ccc03e00cd0e08e494f5fd058a6c55a6a1907 # v2.82.8
        with:
          tool: nextest@0.9.138
          fallback: none

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.11.x
          architecture: x64

      - name: Configure Linux ARM64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          rustup target add aarch64-unknown-linux-gnu
          sudo apt-get update
          sudo apt-get install -yq --no-install-suggests --no-install-recommends \
            binfmt-support g++-10-aarch64-linux-gnu gcc-10-aarch64-linux-gnu \
            libc6-arm64-cross qemu-user qemu-user-binfmt
          sudo ln -sf /usr/aarch64-linux-gnu/lib/ld-linux-aarch64.so.1 \
            /lib/ld-linux-aarch64.so.1
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=/usr/bin/aarch64-linux-gnu-gcc-10" >> "$GITHUB_ENV"
          echo "QEMU_LD_PREFIX=/usr/aarch64-linux-gnu" >> "$GITHUB_ENV"

      - name: Install Clang 19
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-19 main" | sudo tee /etc/apt/sources.list.d/llvm-toolchain-jammy-19.list
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/llvm-snapshot.gpg >/dev/null
          sudo apt-get update
          sudo apt-get install -y clang-19 clang-format-19 libclang-19-dev lld-19
          echo "LIBCLANG_PATH=/usr/lib/llvm-19/lib" >> "$GITHUB_ENV"

      - name: Set LIBCLANG_PATH on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: v0.15.0

      - name: Check Rust formatting
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo fmt --check

      - name: Build and test default release
        run: cargo nextest run --all-targets --locked --release --target ${{ matrix.target }}

      - name: Clippy default release
        run: cargo clippy --all-targets --locked --release --target ${{ matrix.target }} -- -D clippy::all

      - name: Package default release
        run: python tools/package_nimbus_release_assets.py --target ${{ matrix.target }}

      - name: Build and test simdutf release
        run: cargo nextest run --all-targets --locked --release --target ${{ matrix.target }} --features simdutf

      - name: Clippy simdutf release
        run: cargo clippy --all-targets --locked --release --target ${{ matrix.target }} --features simdutf -- -D clippy::all

      - name: Package simdutf release
        run: python tools/package_nimbus_release_assets.py --target ${{ matrix.target }} --features-suffix simdutf

      - name: Build ptrcomp simdutf release
        if: matrix.pointer_compression
        run: cargo build --all-targets --locked --release --target ${{ matrix.target }} --features "v8_enable_pointer_compression simdutf"

      - name: Test ptrcomp simdutf release
        if: matrix.pointer_compression && matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo nextest run --all-targets --locked --release --target ${{ matrix.target }} --features "v8_enable_pointer_compression simdutf"

      - name: Clippy ptrcomp simdutf release
        if: matrix.pointer_compression
        run: cargo clippy --all-targets --locked --release --target ${{ matrix.target }} --features "v8_enable_pointer_compression simdutf" -- -D clippy::all

      - name: Package ptrcomp simdutf release
        if: matrix.pointer_compression
        run: python tools/package_nimbus_release_assets.py --target ${{ matrix.target }} --features-suffix ptrcomp_simdutf

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nimbus-rusty-v8-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  publish:
    name: publish release assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          pattern: nimbus-rusty-v8-*

      - name: Generate checksums and verify exact asset contract
        run: >-
          python tools/verify_nimbus_release_assets.py release-artifacts
          --write-checksums --flatten-to release-assets

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes "Nimbus rusty_v8 $GITHUB_REF_NAME" \
              --draft \
              --verify-tag
          fi
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            release-assets/*
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
