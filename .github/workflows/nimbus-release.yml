name: nimbus release assets

on:
  push:
    branches: ["nimbus/v*"]
    tags: ["v*-nimbus.*"]
  pull_request:
    branches: ["nimbus/v*"]

permissions:
  contents: read

jobs:
  release_matrix:
    name: derive release matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.manifest.outputs.matrix }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Test release tooling
        run: python3 tools/test_nimbus_release_tools.py

      - name: Verify release tag matches crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 tools/nimbus_release_manifest.py --verify-tag "$GITHUB_REF_NAME"

      - name: Read release manifest
        id: manifest
        shell: bash
        run: >-
          echo "matrix=$(python3 tools/nimbus_release_manifest.py
          --github-matrix)" >> "$GITHUB_OUTPUT"

  build:
    name: release ${{ matrix.target }}
    needs: release_matrix
    runs-on: ${{ matrix.os }}
    # A cold AArch64 GNU run builds and tests all four supported feature
    # configurations sequentially; allow enough time for the full proof.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release_matrix.outputs.matrix) }}
    env:
      V8_FROM_SOURCE: "true"
      RUSTFLAGS: -D warnings
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_CACHE_SIZE: 2G
      SCCACHE_IDLE_TIMEOUT: 0
    steps:
      - name: Configure git
        run: git config --global core.symlinks true

      - name: Clone repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 10
          submodules: recursive

      - name: Install Rust
        uses: dsherret/rust-toolchain-file@v1

      - name: Install nextest
        if: ${{ ! matrix.build_only }}
        uses: taiki-e/install-action@c93ccc03e00cd0e08e494f5fd058a6c55a6a1907 # v2.82.8
        with:
          tool: nextest@0.9.138
          fallback: none

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.11.x
          architecture: x64

      - name: Configure Linux ARM64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          rustup target add aarch64-unknown-linux-gnu
          sudo apt-get update
          sudo apt-get install -yq --no-install-suggests --no-install-recommends \
            binfmt-support g++-aarch64-linux-gnu gcc-aarch64-linux-gnu \
            libc6-arm64-cross qemu-user qemu-user-binfmt
          sudo ln -sf /usr/aarch64-linux-gnu/lib/ld-linux-aarch64.so.1 \
            /lib/ld-linux-aarch64.so.1
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=/usr/bin/aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "QEMU_LD_PREFIX=/usr/aarch64-linux-gnu" >> "$GITHUB_ENV"

      - name: Install musl cross compilation toolchain
        if: contains(matrix.target, '-linux-musl')
        shell: bash
        run: |
          rustup target add ${{ matrix.target }}

          # V8 target objects use musl while executable build tools remain
          # glibc-hosted. Assemble only the target headers and libraries.
          SYSROOT="${HOME}/musl-sysroot"
          case "${{ matrix.target }}" in
            x86_64-*)
              sudo apt-get update
              sudo apt-get install -yq \
                --no-install-suggests --no-install-recommends \
                musl-tools musl-dev
              mkdir -p "${SYSROOT}/usr/include" "${SYSROOT}/usr/lib"
              cp -a /usr/include/x86_64-linux-musl/. \
                "${SYSROOT}/usr/include/"
              cp -a /usr/lib/x86_64-linux-musl/. \
                "${SYSROOT}/usr/lib/"
              cp -a /usr/include/linux "${SYSROOT}/usr/include/"
              cp -a /usr/include/asm-generic "${SYSROOT}/usr/include/"
              cp -a /usr/include/x86_64-linux-gnu/asm \
                "${SYSROOT}/usr/include/"
              ;;
            aarch64-*)
              # Pin the Alpine userspace that carries apk and its trusted keys.
              # Resolve signed target packages from the maintained v3.21 index
              # so an apk package revision cannot make this workflow 404.
              ALPINE_IMAGE=docker.io/library/alpine@sha256:f27cad9117495d32d067133afff942cb2dc745dfe9163e949f6bfe8a6a245339
              mkdir -p "${SYSROOT}"
              docker run --rm --platform linux/amd64 \
                -v "${SYSROOT}:/sysroot" "${ALPINE_IMAGE}" sh -euc '
                  mkdir -p /sysroot/etc/apk/keys
                  cp -L /usr/share/apk/keys/aarch64/*.pub \
                    /sysroot/etc/apk/keys/
                  apk --arch aarch64 \
                    -X https://dl-cdn.alpinelinux.org/alpine/v3.21/main \
                    --root /sysroot --initdb add musl-dev linux-headers
                '
              ;;
          esac

          echo "RUSTY_V8_MUSL_SYSROOT=${SYSROOT}" >> "$GITHUB_ENV"

      - name: Install Clang 21
        if: runner.os == 'Linux'
        shell: bash
        run: |
          . /etc/os-release
          echo "deb http://apt.llvm.org/$VERSION_CODENAME/ llvm-toolchain-$VERSION_CODENAME-21 main" | sudo tee /etc/apt/sources.list.d/llvm-toolchain-21.list
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/llvm-snapshot.gpg >/dev/null
          sudo apt-get update
          sudo apt-get install -y clang-21 clang-format-21 libclang-21-dev lld-21
          echo "LIBCLANG_PATH=/usr/lib/llvm-21/lib" >> "$GITHUB_ENV"

      - name: Install Clang 21 on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install llvm@21
          echo "LIBCLANG_PATH=$(brew --prefix llvm@21)/lib" >> "$GITHUB_ENV"

      - name: Install LLVM 21 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/install_llvm_windows.ps1

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: v0.15.0

      - name: Check Rust formatting
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo fmt --check

      - name: Build and test default release
        if: ${{ ! matrix.build_only }}
        run: cargo nextest run --all-targets --locked --release --target ${{ matrix.target }}

      - name: Test documentation examples
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --doc --locked --release --target ${{ matrix.target }}

      - name: Build default release (build-only)
        if: matrix.build_only
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Clippy default release
        if: ${{ ! matrix.build_only }}
        run: cargo clippy --all-targets --locked --release --target ${{ matrix.target }} -- -D clippy::all

      - name: Package default release
        run: python tools/package_nimbus_release_assets.py --target ${{ matrix.target }}

      - name: Build and test simdutf release
        if: ${{ ! matrix.build_only }}
        run: cargo nextest run --all-targets --locked --release --target ${{ matrix.target }} --features simdutf

      - name: Build simdutf release (build-only)
        if: matrix.build_only
        run: cargo build --locked --release --target ${{ matrix.target }} --features simdutf

      - name: Clippy simdutf release
        if: ${{ ! matrix.build_only }}
        run: cargo clippy --all-targets --locked --release --target ${{ matrix.target }} --features simdutf -- -D clippy::all

      - name: Package simdutf release
        run: python tools/package_nimbus_release_assets.py --target ${{ matrix.target }} --features-suffix simdutf

      - name: Build ptrcomp release
        if: matrix.pointer_compression
        run: cargo build --all-targets --locked --release --target ${{ matrix.target }} --features v8_enable_pointer_compression

      - name: Test ptrcomp release
        if: matrix.pointer_compression
        run: cargo nextest run --all-targets --locked --release --target ${{ matrix.target }} --features v8_enable_pointer_compression

      - name: Clippy ptrcomp release
        if: matrix.pointer_compression
        run: cargo clippy --all-targets --locked --release --target ${{ matrix.target }} --features v8_enable_pointer_compression -- -D clippy::all

      - name: Package ptrcomp release
        if: matrix.pointer_compression
        run: python tools/package_nimbus_release_assets.py --target ${{ matrix.target }} --features-suffix ptrcomp

      - name: Build ptrcomp simdutf release
        if: matrix.pointer_compression
        run: cargo build --all-targets --locked --release --target ${{ matrix.target }} --features "v8_enable_pointer_compression simdutf"

      - name: Test ptrcomp simdutf release
        if: matrix.pointer_compression
        run: cargo nextest run --all-targets --locked --release --target ${{ matrix.target }} --features "v8_enable_pointer_compression simdutf"

      - name: Clippy ptrcomp simdutf release
        if: matrix.pointer_compression
        run: cargo clippy --all-targets --locked --release --target ${{ matrix.target }} --features "v8_enable_pointer_compression simdutf" -- -D clippy::all

      - name: Package ptrcomp simdutf release
        if: matrix.pointer_compression
        run: python tools/package_nimbus_release_assets.py --target ${{ matrix.target }} --features-suffix ptrcomp_simdutf

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nimbus-rusty-v8-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  publish:
    name: publish release assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          pattern: nimbus-rusty-v8-*

      - name: Verify build checksums and exact asset contract
        run: >-
          python3 tools/verify_nimbus_release_assets.py release-artifacts
          --flatten-to release-assets

      - name: Upload draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if release_is_draft="$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq .isDraft 2>/dev/null)"; then
            if [[ "$release_is_draft" != "true" ]]; then
              echo "Release $GITHUB_REF_NAME is already published; use a new Nimbus tag." >&2
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes "Nimbus rusty_v8 $GITHUB_REF_NAME" \
              --draft \
              --verify-tag
          fi
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            release-assets/*

      - name: Verify remote draft assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_assets="$RUNNER_TEMP/nimbus-remote-release-assets"
          mkdir "$remote_assets"
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$remote_assets"
          python3 tools/verify_nimbus_release_assets.py "$remote_assets"

      - name: Publish verified release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
